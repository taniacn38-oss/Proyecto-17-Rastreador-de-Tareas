<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto 17 - Task Tracker Ciencias Naturales</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="task-container">
      <h2>Rastreador de Tareas</h2>
      <p class="subtitle">
        Ciencias Naturales - Informes, maquetas y estudios.
      </p>

      <form id="task-form">
        <input
          type="text"
          id="task-input"
          placeholder="Escribe una tarea y presiona Enter..."
          autocomplete="off"
        />
      </form>

      <div id="tasks-list" class="tasks-list">
        <!-- Las tareas se renderizan dinámicamente aquí -->
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
